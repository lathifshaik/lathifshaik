<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="133" height="46" viewBox="0 0 133 46" role="img" aria-label="EMAIL ME"><title>EMAIL ME</title><style>@font-face{font-family:'Sans';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}.s{font-family:'Sans',sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.wob{transform-box:fill-box;transform-origin:center;animation:wob 4s ease-in-out infinite}
.bob{animation:bob 5s ease-in-out infinite}
